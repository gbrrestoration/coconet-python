<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reef Rescuer — Top scorers</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <header>
        <h1>Top scorers</h1>
        <p class="lede">Longest reef survival times on this server.</p>
        <a class="text-link" href="/">Back to game</a>
      </header>

      <section class="panel leaderboard-panel">
        <table class="leaderboard-table">
          <thead>
            <tr>
              <th>Rank</th>
              <th>Name</th>
              <th>Survival</th>
            </tr>
          </thead>
          <tbody id="leaderboard-rows">
            <tr>
              <td colspan="3">Loading scores…</td>
            </tr>
          </tbody>
        </table>
      </section>

      <footer>
        <p>Top 10 survival times are saved on the server.</p>
      </footer>
    </main>
    <script src="/leaderboard.js" type="module"></script>
  </body>
</html>

[project]
name = "coconet-python"
version = "0.4.3"
description = "Headless Python port of the legacy CoCoNet NetLogo model."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2.0",
  "pandas>=2.2.0",
  "pyyaml>=6.0.0",
  "threadpoolctl>=3.5.0",
]

[project.optional-dependencies]
profile = [
  "pyinstrument>=5.0.0",
]

[project.scripts]
coconet = "coconet.cli:main"

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

# Distribution name is coconet-python; import package remains `coconet`.
[tool.hatch.build.targets.wheel]
packages = ["coconet"]

[dependency-groups]
dev = [
  "mypy>=1.13.0",
  "pandas-stubs>=2.2.0",
  "pytest>=8.3.0",
  "ruff>=0.9.0",
  "types-PyYAML>=6.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = [
  "integration: end-to-end run_coconet on the mini reef fixture",
]

[tool.uv]
package = true

# TestPyPI upload/install (used by CI and local dry runs: `uv publish --index testpypi`).
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["coconet", "scripts", "tests"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # pyflakes
  "I",   # isort
  "B",   # flake8-bugbear
  "UP",  # pyupgrade
  "SIM", # flake8-simplify
  "RUF", # Ruff-specific
]
ignore = [
  "E501", # line length (handled by formatter tolerance; long strings in model)
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
files = ["coconet", "scripts"]
show_error_codes = true
pretty = true
warn_unused_ignores = true
warn_return_any = true
strict = false
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
  "pyinstrument.*",
  "threadpoolctl.*",
]
ignore_missing_imports = true

# The simulation engine assigns hundreds of lazily initialized ndarrays on `self`;
# typing that state machine tightly would be a large, separate refactor.
[[tool.mypy.overrides]]
module = "coconet.model"
ignore_errors = true

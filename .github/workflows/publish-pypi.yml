name: Publish to PyPI

# Trusted publishing (OpenID Connect): PyPI and TestPyPI exchange a short-lived token with
# GitHub Actions. Do not set PYPI_API_TOKEN, TEST_PYPI_API_TOKEN, or UV_PUBLISH_TOKEN.
#
# One-time setup:
# 1. GitHub → Settings → Environments → create environment named `pypi` (recommended:
#    require reviewers for production releases, or leave open while iterating).
# 2. TestPyPI → project `coconet-python` → Settings → Publishing → add a trusted publisher:
#    - Workflow: `publish-pypi.yml` in this repo
#    - Environment: `pypi` (must match `jobs.publish.environment` below)
# 3. PyPI → same project → Settings → Publishing → add the same publisher
#    (repo, workflow file, environment `pypi`).
#
# Publishes to TestPyPI first, smoke-installs, then publishes to PyPI.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Build distributions
        run: uv build --no-sources

      - name: Publish to TestPyPI
        run: uv publish --index testpypi

      # TestPyPI’s PEP 503 simple index often lags minutes behind the project “Releases” UI; retry installs.
      - name: Smoke install from TestPyPI
        run: |
          set -eux
          PKG_SPEC="$(python -c "import tomllib; p = tomllib.load(open('pyproject.toml', 'rb'))['project']; print(f\"{p['name']}=={p['version']}\")")"
          uv venv .venv-smoke
          MAX_ATTEMPTS=24
          SLEEP_SECS=15
          attempt=1
          while true; do
            echo "Smoke install attempt ${attempt}/${MAX_ATTEMPTS} (${PKG_SPEC})..."
            # first-index (uv default): coconet-python exists on PyPI, so uv never considers
            # newer versions-only-on-TestPyPI; unsafe-best-match merges indexes (OK for this job).
            if uv pip install --python .venv-smoke/bin/python \
              --index-strategy unsafe-best-match \
              --index-url https://test.pypi.org/simple \
              --extra-index-url https://pypi.org/simple \
              "${PKG_SPEC}"; then
              break
            fi
            if [ "${attempt}" -ge "${MAX_ATTEMPTS}" ]; then
              echo "Smoke install still failing after ${MAX_ATTEMPTS} attempts; giving up."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep "${SLEEP_SECS}"
          done
          .venv-smoke/bin/python -c "from coconet import load_coconet_config, run_coconet; print('import-ok')"

      - name: Publish to PyPI
        run: uv publish

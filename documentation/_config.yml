# Published base URL is set at build time in CI: bundle exec jekyll build --baseurl "/<repo>"
title: CoCoNet (Python)
description: >-
  User documentation for the headless Python port of the CoCoNet Great Barrier Reef
  simulation model (legacy NetLogo CoCoNet v3): CLI and PyPI library (coconet-python) entry points,
  configuration, and I/O reference.
url: ""
# baseurl filled by GitHub Actions (repository name). For local preview: jekyll serve --baseurl ""
baseurl: ""
# Footer link; update when you fork.
repo_web_url: "https://github.com/gbrrestoration/coconet-python"

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # Pretty paths (…/page/index.html) so GitHub Pages serves /repo/page/ without 404.
  - scope:
      path: ""
      type: pages
    values:
      permalink: /:basename/
  - scope:
      path: "index.md"
    values:
      permalink: /

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
